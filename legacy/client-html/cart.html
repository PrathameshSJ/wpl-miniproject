<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>BakeEase | Your Cart & Checkout</title>
    <script src="../assets/js/tailwind-cdn.js"></script>
    <script src="js/tailwind-config.js"></script>
    <link rel="stylesheet" href="styles/cnc.css" />
</head>

<body class="bg-surface text-on-surface font-body min-h-screen flex flex-col">

    <div id="navbar-placeholder"></div>

    <main class="flex-grow pt-28 pb-20 px-6 max-w-7xl mx-auto w-full">
        <div class="grid grid-cols-1 lg:grid-cols-10 gap-12">

            <div class="lg:col-span-6 space-y-8">
                <div class="flex items-baseline gap-4 mb-8">
                    <h1 class="text-4xl font-bold tracking-tight text-on-surface">Your Cart</h1>
                    <span id="cart-item-count" class="bg-primary-container text-on-primary-container px-3 py-1 rounded-full text-sm font-semibold">0 items</span>
                </div>

                <div id="cart-items-container" class="space-y-6">
                    <!-- Dynamic cart items will be injected here -->
                </div>

                <div class="mt-12 bg-surface-container-low p-4 rounded-xl flex items-center justify-between gap-4">
                    <input id="coupon-input" type="text" placeholder="Enter coupon code (e.g. BAKE20)" class="w-full bg-surface-container-lowest border-outline-variant/30 rounded-lg focus:ring-0 focus:border-primary-container p-3 text-on-surface uppercase" />
                    <button id="apply-coupon-btn" class="bg-primary hover:opacity-90 text-on-primary px-6 py-3 rounded-lg font-bold text-sm transition-all whitespace-nowrap">Apply</button>
                </div>
                
                <div id="coupon-message-container" class="hidden mt-4 bg-green-50 dark:bg-green-950/20 border border-green-100 dark:border-green-900/30 p-4 rounded-xl flex items-center justify-between transition-all">
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined text-green-700" data-icon="sell">sell</span>
                        <p id="coupon-message" class="text-green-800 dark:text-green-200 font-semibold"></p>
                    </div>
                    <button id="remove-coupon-btn" class="text-green-700 underline text-sm font-bold uppercase tracking-wider">Remove</button>
                </div>
            </div>

            <div class="lg:col-span-4">
                <div class="sticky top-28 space-y-6">
                    <div class="bg-surface-container-lowest p-8 rounded-2xl shadow-lg shadow-on-surface/5 border border-outline-variant/10">
                        <h2 class="text-2xl font-bold mb-6 text-on-surface">Order Summary</h2>
                        
                        <div class="space-y-4 mb-8">
                            <div class="flex justify-between text-on-surface-variant">
                                <span>Subtotal</span>
                                <span id="summary-subtotal" class="font-semibold">₹0</span>
                            </div>
                            <div id="summary-discount-row" class="hidden flex justify-between text-green-600">
                                <span>Discount <span id="summary-discount-pct"></span></span>
                                <span id="summary-discount-amt" class="font-semibold">-₹0</span>
                            </div>
                            <div id="summary-delivery-row" class="flex justify-between text-on-surface-variant">
                                <span>Delivery Fee</span>
                                <span id="summary-delivery-fee" class="font-semibold">₹49</span>
                            </div>
                            <div class="h-px bg-outline-variant/30 my-4"></div>
                            <div class="flex justify-between text-2xl font-bold text-on-surface">
                                <span>Total</span>
                                <span id="summary-total">₹0</span>
                            </div>
                        </div>

                        <div class="flex p-1 bg-surface-container rounded-xl mb-8">
                            <button id="btn-delivery" class="flex-1 py-2 rounded-lg bg-white shadow-sm text-primary font-bold transition-all">Home Delivery</button>
                            <button id="btn-pickup" class="flex-1 py-2 rounded-lg text-on-surface-variant hover:text-primary transition-all">Pickup</button>
                        </div>

                        <div class="space-y-4 mb-8">
                            <div id="address-container" class="transition-all duration-300 overflow-hidden">
                                <label class="block text-xs font-bold text-outline uppercase tracking-widest mb-1 ml-1">Delivery Address</label>
                                <input id="delivery-address" class="w-full bg-surface-container-lowest border-outline-variant/30 rounded-lg focus:ring-0 focus:border-primary-container p-3 text-on-surface" type="text" placeholder="Enter full address..." />
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-bold text-outline uppercase tracking-widest mb-1 ml-1">Date</label>
                                    <input id="delivery-date" type="date" class="w-full bg-surface-container-lowest border-outline-variant/30 rounded-lg focus:ring-0 focus:border-primary-container p-3 text-on-surface" />
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-outline uppercase tracking-widest mb-1 ml-1">Time Slot</label>
                                    <select id="delivery-time" class="w-full bg-surface-container-lowest border-outline-variant/30 rounded-lg focus:ring-0 focus:border-primary-container p-3 text-on-surface">
                                        <option value="10:00 AM - 12:00 PM">10:00 AM - 12:00 PM</option>
                                        <option value="02:00 PM - 04:00 PM">02:00 PM - 04:00 PM</option>
                                        <option value="04:00 PM - 06:00 PM">04:00 PM - 06:00 PM</option>
                                        <option value="06:00 PM - 08:00 PM">06:00 PM - 08:00 PM</option>
                                    </select>
                                </div>
                            </div>
                            <div class="flex items-center gap-2 text-primary font-semibold text-sm">
                                <span class="material-symbols-outlined text-sm" data-icon="schedule">schedule</span>
                                <span id="delivery-estimate-text">Estimated delivery: 2-4 hours from slot start</span>
                            </div>
                        </div>

                        <div class="mb-8">
                            <label class="block text-xs font-bold text-outline uppercase tracking-widest mb-3 ml-1">Payment Method</label>
                            <div class="space-y-2">
                                <label class="flex items-center justify-between p-4 rounded-xl border-2 border-primary bg-primary/5 cursor-pointer">
                                    <div class="flex items-center gap-3">
                                        <span class="material-symbols-outlined text-primary" data-icon="account_balance_wallet">account_balance_wallet</span>
                                        <span class="font-bold text-on-surface">UPI</span>
                                    </div>
                                    <input checked class="text-primary focus:ring-0" name="payment" type="radio" value="upi" />
                                </label>
                                <label class="flex items-center justify-between p-4 rounded-xl border border-outline-variant/30 hover:border-primary/50 transition-colors cursor-pointer">
                                    <div class="flex items-center gap-3">
                                        <span class="material-symbols-outlined text-stone-500" data-icon="payments">payments</span>
                                        <span class="font-bold text-on-surface">Cash on Delivery</span>
                                    </div>
                                    <input class="text-primary focus:ring-0" name="payment" type="radio" value="cod" />
                                </label>
                            </div>
                        </div>

                        <button id="place-order-btn" class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary py-4 rounded-lg font-bold text-lg flex items-center justify-center gap-2 hover:opacity-90 transition-all shadow-lg shadow-primary/20 disabled:opacity-50 disabled:cursor-not-allowed">
                            Place Order
                            <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
                        </button>
                        <div class="flex items-center justify-center gap-2 mt-4 text-outline text-xs uppercase font-bold tracking-widest">
                            <span class="material-symbols-outlined text-sm" data-icon="lock" data-weight="fill">lock</span>
                            Secure SSL Encrypted Checkout
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

<script src="./js/api.js"></script>
<script src="./js/cart.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/components.js"></script>
<script src="./js/cart-page.js"></script>
</body>

</html>
