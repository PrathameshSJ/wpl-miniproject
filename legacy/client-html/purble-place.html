<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>BakeEase - Purble Place</title>
    <script src="../assets/js/tailwind-cdn.js"></script>
    <script src="js/tailwind-config.js"></script>
    <link href="styles/base.css" rel="stylesheet" />
    <style>
        .game-container {
            width: 710px;
            height: 470px;
            overflow: hidden;
            position: relative;
            margin: 0 auto;
            border: 2px solid white;
            border-radius: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            background-color: #000;
        }

        .game-iframe {
            position: absolute;
            top: 0px;
            left: 0px;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body
    class="bg-[#2C1810] font-body text-on-surface selection:bg-primary-fixed selection:text-on-primary-fixed min-h-screen flex flex-col">
    <div id="navbar-placeholder"></div>
    <main class="flex-grow pt-32 pb-16 flex flex-col items-center justify-center relative overflow-hidden px-4">

        <div class="text-center mb-8">
            <h1 class="text-orange-300 font-black font-inter uppercase tracking-widest text-3xl mb-2">Purble Place</h1>
            <p class="text-white/60 text-sm max-w-md mx-auto">Take a break from baking and enjoy a nostalgic classic
                right here in your kitchen!</p>
        </div>

        <div class="game-container" id="gameContainer">
            <iframe id="gameIframe" src="https://turbowarp.org/964792609/embed" class="game-iframe" allowfullscreen
                frameborder="0" scrolling="no" sandbox="allow-scripts allow-same-origin">
            </iframe>
        </div>

        <!-- Dev Controls (Can be hidden later) 
            <div class="fixed bottom-4 left-4 bg-stone-900/90 backdrop-blur-md p-4 rounded-xl border border-stone-700 shadow-2xl z-50 flex flex-col gap-3 text-white w-72 text-sm font-inter">
                <div class="flex justify-between items-center mb-1">
                    <h3 class="font-bold text-orange-400">Dev Layout Controls</h3>
                    <button onclick="this.parentElement.parentElement.style.display='none'" class="text-stone-400 hover:text-white">&times;</button>
                </div>
                
                <div>
                    <label class="flex justify-between text-xs text-stone-400 mb-1">Container Width <span id="cw-val">710px</span></label>
                    <input type="range" min="300" max="1200" value="710" class="w-full accent-orange-500" oninput="updateStyle('gameContainer', 'width', this.value+'px'); document.getElementById('cw-val').innerText=this.value+'px'">
                </div>
                <div>
                    <label class="flex justify-between text-xs text-stone-400 mb-1">Container Height <span id="ch-val">470px</span></label>
                    <input type="range" min="200" max="1000" value="470" class="w-full accent-orange-500" oninput="updateStyle('gameContainer', 'height', this.value+'px'); document.getElementById('ch-val').innerText=this.value+'px'">
                </div>
                
                <div class="border-t border-stone-700 my-1 pt-2"></div>
                
                <div>
                    <label class="flex justify-between text-xs text-stone-400 mb-1">Iframe Top <span id="it-val">0px</span></label>
                    <input type="range" min="-500" max="500" value="0" class="w-full accent-orange-500" oninput="updateStyle('gameIframe', 'top', this.value+'px'); document.getElementById('it-val').innerText=this.value+'px'">
                </div>
                <div>
                    <label class="flex justify-between text-xs text-stone-400 mb-1">Iframe Left <span id="il-val">0px</span></label>
                    <input type="range" min="-500" max="500" value="0" class="w-full accent-orange-500" oninput="updateStyle('gameIframe', 'left', this.value+'px'); document.getElementById('il-val').innerText=this.value+'px'">
                </div>
                <div>
                    <label class="flex justify-between text-xs text-stone-400 mb-1">Iframe Width <span id="iw-val">100%</span></label>
                    <input type="range" min="50" max="200" value="100" class="w-full accent-orange-500" oninput="updateStyle('gameIframe', 'width', this.value+'%'); document.getElementById('iw-val').innerText=this.value+'%'">
                </div>
                <div>
                    <label class="flex justify-between text-xs text-stone-400 mb-1">Iframe Height <span id="ih-val">100%</span></label>
                    <input type="range" min="50" max="200" value="100" class="w-full accent-orange-500" oninput="updateStyle('gameIframe', 'height', this.value+'%'); document.getElementById('ih-val').innerText=this.value+'%'">
                </div>
            </div> -->

        <script>
            function updateStyle(id, prop, val) {
                document.getElementById(id).style[prop] = val;
            }
        </script>

    </main>
    <div id="footer-placeholder"></div>

    <script src="./js/api.js"></script>
    <script src="./js/cart.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/components.js"></script>
</body>

</html>
