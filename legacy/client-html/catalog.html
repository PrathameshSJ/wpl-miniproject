<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>BakeEase — Menu</title>
    <script src="../assets/js/tailwind-cdn.js"></script>
    <script src="./js/tailwind-config.js"></script>
    <link href="./styles/base.css" rel="stylesheet"/>
    <link href="./styles/catalog.css" rel="stylesheet"/>
</head>
<body class="bg-surface text-on-surface">

<div id="navbar-placeholder"></div>

<main class="pt-24 max-w-7xl mx-auto px-6 flex gap-8">
    <!-- Sidebar Filters -->
    <aside class="w-[280px] shrink-0 sticky top-24 h-[calc(100vh-120px)] overflow-y-auto no-scrollbar pr-4 hidden md:block">
        <div class="flex justify-between items-end mb-6">
            <h2 class="text-2xl font-bold text-on-surface font-headline">Filters</h2>
            <button class="text-sm font-medium text-error hover:underline" onclick="catalogState.search='';catalogState.category=null;catalogState.sort='newest';loadCatalogProducts();">Clear All</button>
        </div>
        <!-- Price Range -->
        <div class="mb-8">
            <h3 class="text-sm font-semibold uppercase tracking-wider text-on-surface-variant mb-4">Price Range</h3>
            <div class="px-2">
                <input class="w-full h-1 bg-surface-container-highest rounded-lg appearance-none cursor-pointer accent-primary" max="2000" min="0" type="range" value="2000"/>
                <div class="flex justify-between mt-2 text-sm font-body text-on-surface-variant"><span>₹0</span><span>₹2000</span></div>
            </div>
        </div>
        <!-- Flavour -->
        <div class="mb-8">
            <h3 class="text-sm font-semibold uppercase tracking-wider text-on-surface-variant mb-4">Flavour</h3>
            <div class="space-y-3">
                <label class="flex items-center gap-3 cursor-pointer group"><input class="rounded border-outline-variant text-primary focus:ring-primary bg-surface-container-lowest" type="checkbox"/><span class="text-on-surface group-hover:text-primary transition-colors">Chocolate</span></label>
                <label class="flex items-center gap-3 cursor-pointer group"><input class="rounded border-outline-variant text-primary focus:ring-primary bg-surface-container-lowest" type="checkbox"/><span class="text-on-surface group-hover:text-primary transition-colors">Vanilla</span></label>
                <label class="flex items-center gap-3 cursor-pointer group"><input class="rounded border-outline-variant text-primary focus:ring-primary bg-surface-container-lowest" type="checkbox"/><span class="text-on-surface group-hover:text-primary transition-colors">Red Velvet</span></label>
                <label class="flex items-center gap-3 cursor-pointer group"><input class="rounded border-outline-variant text-primary focus:ring-primary bg-surface-container-lowest" type="checkbox"/><span class="text-on-surface group-hover:text-primary transition-colors">Butterscotch</span></label>
            </div>
        </div>
    </aside>

    <!-- Right Content Area -->
    <section class="flex-1 pb-16">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div class="relative flex-1 max-w-lg">
                <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">search</span>
                <input id="catalog-search" class="w-full pl-12 pr-4 py-3 rounded-xl bg-surface-container-lowest border-none focus:ring-2 focus:ring-primary-container text-on-surface shadow-sm" placeholder="Search cakes, pastries…" type="text"/>
            </div>
            <div class="flex items-center gap-6">
                <span id="catalog-count" class="text-sm font-body text-on-surface-variant">Loading...</span>
                <select id="catalog-sort" class="bg-transparent border-none focus:ring-0 text-sm font-semibold text-primary cursor-pointer pr-8">
                    <option value="newest">Sort: Newest</option>
                    <option value="price_asc">Price: Low–High</option>
                    <option value="price_desc">Price: High–Low</option>
                    <option value="popular">Most Popular</option>
                </select>
            </div>
        </div>
        <!-- Dynamic Product Grid -->
        <div id="catalog-grid" class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Loaded by catalog.js -->
        </div>
    </section>
</main>

<div id="footer-placeholder"></div>

<script src="./js/api.js"></script>
<script src="./js/cart.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/components.js"></script>
<script src="./js/catalog.js"></script>
</body>
</html>
