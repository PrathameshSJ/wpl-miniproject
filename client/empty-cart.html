<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="../assets/js/tailwind-cdn.js"></script>
    <script src="./js/tailwind-config.js"></script>
    <link href="./styles/empty-cart.css" rel="stylesheet" />
</head>

<body class="font-body selection:bg-primary-fixed selection:text-on-primary-fixed flex flex-col min-h-screen">

    <div id="navbar-placeholder"></div>

    <main class="flex-grow flex flex-col items-center justify-center px-6 pt-32 pb-20">
        <div class="max-w-xl w-full text-center space-y-12">
            
            <div class="relative inline-block">
                <div class="absolute inset-0 bg-surface-container-low rounded-full blur-3xl opacity-60 scale-150 -z-10"></div>
                <div class="relative bg-surface-container-lowest rounded-full p-12 shadow-sm border border-outline-variant/10">
                    <div aria-label="Cake Emoji" role="img"
                         class="text-9xl transform -rotate-6 transition-transform hover:rotate-0 duration-500 ease-in-out cursor-default select-none">
                        🍰
                    </div>
                </div>
                <div class="absolute -top-4 -right-4 bg-primary-container text-on-primary-container px-4 py-1 rounded-full text-xs font-label font-semibold tracking-widest uppercase">
                    Freshly Baked
                </div>
            </div>

            <div class="space-y-4">
                <h1 class="text-4xl md:text-5xl font-headline font-bold text-on-surface tracking-tight leading-tight">
                    Your cart is empty
                </h1>
                <p class="text-lg md:text-xl font-body text-on-surface-variant max-w-md mx-auto leading-relaxed">
                    Looks like you haven't added anything yet.
                </p>
            </div>

            <div>
                <button onclick="window.location.href='catalog.html'" class="group inline-flex items-center justify-center px-10 py-4 bg-gradient-to-br from-primary to-primary-container text-on-primary font-label font-semibold rounded-lg shadow-lg hover:opacity-90 active:scale-95 transition-all duration-200 uppercase tracking-wider">
                    <span>Browse Menu</span>
                    <span class="material-symbols-outlined ml-2 group-hover:translate-x-1 transition-transform">arrow_forward</span>
                </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-16 pt-12 border-t border-outline-variant/10">
                <div class="group relative overflow-hidden rounded-xl bg-surface-container-low p-6 text-left transition-all hover:bg-surface-container-high border border-outline-variant/10">
                    <span class="block text-primary font-headline text-2xl mb-2">Morning Pastries</span>
                    <p class="text-sm text-on-surface-variant mb-4">Start your day with our buttery, flaky croissants and danishes.</p>
                    <img src="./images/morning-pastries.png" alt="Morning Pastries" class="w-full h-32 object-cover rounded-md" />
                </div>

                <div class="group relative overflow-hidden rounded-xl bg-surface-container-low p-6 text-left transition-all hover:bg-surface-container-high border border-outline-variant/10">
                    <span class="block text-primary font-headline text-2xl mb-2">Artisan Loaves</span>
                    <p class="text-sm text-on-surface-variant mb-4">Slow-fermented sourdough and rustic grains for the perfect slice.</p>
                    <img src="./images/artisan-loaves.png" alt="Artisan Loaves" class="w-full h-32 object-cover rounded-md" />
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>


<script src="./js/api.js"></script>
<script src="./js/cart.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/components.js"></script>
</body>
</html>
