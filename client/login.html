<!DOCTYPE html>

<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BakeEase - Artisan Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Noto+Serif:wght@700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="./js/tailwind-config.js"></script>

<link href="./styles/login.css" rel="stylesheet"/></head>
<body class="min-h-screen antialiased">
<div class="flex flex-col lg:flex-row min-h-screen">
<!-- Visual Sidebar -->
<aside class="relative hidden lg:block lg:w-1/2 overflow-hidden">
<img alt="Artisan pastries" class="absolute inset-0 w-full h-full object-cover" src="./images/Artisan pastries.png"/>
<div class="absolute inset-0 bg-primary/20 mix-blend-multiply"></div>
<div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
<div class="absolute bottom-12 left-12 right-12 text-white">
<blockquote class="text-3xl font-serif italic mb-4">
                    "The secret ingredient is always a little bit of love and a lot of butter."
                </blockquote>
<p class="text-sm font-semibold tracking-widest uppercase opacity-80">— The BakeEase Artisan</p>
</div>
</aside>
<!-- Form Section -->
<main class="flex-1 flex items-start justify-center p-6 lg:p-12 xl:p-16 bg-surface-bright pt-8 lg:pt-12">
<div class="w-full max-w-[480px] space-y-6">
<!-- Header Section -->
<header class="text-center lg:text-left">
<h1 class="text-4xl font-bold tracking-tight text-primary font-serif mb-3 cursor-pointer" onclick="window.location.href='home.html'">BakeEase</h1>
<p class="text-on-surface-variant text-base font-body italic">Crafting memories, one bite at a time.
                    </p>
</header>
<!-- Tab Switcher -->
<nav class="flex border-b border-outline-variant/20 mb-6">
<button id="tab-login" onclick="toggleAuth('login')" class="px-8 py-3 text-sm font-semibold text-primary border-b-2 border-primary transition-all duration-200">
                        Login
                    </button>
<button id="tab-register" onclick="toggleAuth('register')" class="px-8 py-3 text-sm font-semibold text-on-surface-variant hover:text-primary transition-all duration-200">
                        Register
                    </button>
</nav>
<!-- Form Content -->
<section id="login-section" class="space-y-4">
<form class="space-y-4 flex flex-col min-h-[460px]">
<!-- Email Field (Error State Example) -->
<div class="space-y-1.5">
<label class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-error rounded-lg px-4 py-2.5 text-on-surface text-sm focus:ring-0 focus:border-primary-container outline-none transition-all placeholder:text-outline" id="email" placeholder="Enter your email" type="email" value="hello@artisan"/>
<div class="absolute right-3 top-3.5 text-error">
<span class="material-symbols-outlined text-lg" data-icon="error">error</span>
</div>
</div>
<p class="text-[11px] text-error font-medium ml-1 flex items-center gap-1">
                                Please enter a valid email address.
                            </p>
</div>
<!-- Password Field -->
<div class="space-y-1.5">
<div class="flex justify-between items-end ml-1">
<label class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant" for="password">Password</label>
<a class="text-[11px] font-semibold text-primary-container hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative">
<input class="w-full bg-surface-container-low border border-outline-variant/30 rounded-lg px-4 py-2.5 text-on-surface text-sm focus:ring-0 focus:border-primary-container outline-none transition-all placeholder:text-outline" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-3.5 text-on-surface-variant/60 hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-lg" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Primary CTA -->
<button class="w-full artisan-gradient text-white font-semibold py-3 rounded-lg shadow-md hover:shadow-lg hover:opacity-95 active:scale-[0.98] transition-all uppercase tracking-widest text-sm" type="button" onclick="window.location.href='home.html'">
                            Login to Kitchen
                        </button>
<!-- Divider -->
<div class="relative py-3">
<div class="absolute inset-0 flex items-center">
<span class="w-full border-t border-outline-variant/20"></span>
</div>
<div class="relative flex justify-center text-xs uppercase">
<span class="bg-surface-bright px-4 text-outline font-medium tracking-tighter">Or
                                    continue with</span>
</div>
</div>
<!-- Social Login -->
<button class="w-full flex items-center justify-center gap-3 bg-white border border-outline-variant/40 hover:bg-surface-container-low text-on-surface font-semibold py-2.5 rounded-lg transition-all text-sm shadow-sm" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                            Google Account
                        </button>
<!-- Guest Access -->
<div class="text-center pt-4 mt-auto pb-4">
<a class="text-xs font-semibold text-on-surface-variant hover:text-primary transition-colors" href="home.html">Browse as Guest</a>
</div>
</form>
</section>
<!-- Register Form Content -->
<section id="register-section" class="space-y-4 hidden">
<form class="space-y-4 flex flex-col min-h-[460px]">
<div class="grid grid-cols-2 gap-4">
<!-- Full Name Field -->
<div class="space-y-1.5">
<label class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant ml-1" for="fullname">Full Name</label>
<div class="relative">
<input class="w-full bg-surface-container-low border border-outline-variant/30 rounded-lg px-4 py-2.5 text-on-surface text-sm focus:ring-0 focus:border-primary-container outline-none transition-all placeholder:text-outline" id="fullname" placeholder="John Doe" type="text" required />
</div>
</div>
<!-- Phone Number Field -->
<div class="space-y-1.5">
<label class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant ml-1" for="phone">Phone Number</label>
<div class="relative">
<input class="w-full bg-surface-container-low border border-outline-variant/30 rounded-lg px-4 py-2.5 text-on-surface text-sm focus:ring-0 focus:border-primary-container outline-none transition-all placeholder:text-outline" id="phone" placeholder="+91 00000 00000" type="tel" required />
</div>
</div>
</div>
<!-- Email Field -->
<div class="space-y-1.5">
<label class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative">
<input class="w-full bg-surface-container-low border border-outline-variant/30 rounded-lg px-4 py-2.5 text-on-surface text-sm focus:ring-0 focus:border-primary-container outline-none transition-all placeholder:text-outline" id="email" placeholder="jane@example.com" type="email" required />
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<!-- Password Field -->
<div class="space-y-1.5">
<label class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant ml-1" for="password">Password</label>
<div class="relative">
<input class="w-full bg-surface-container-low border border-outline-variant/30 rounded-lg px-4 py-2.5 text-on-surface text-sm focus:ring-0 focus:border-primary-container outline-none transition-all placeholder:text-outline" id="password" placeholder="••••••••" type="password" required />
<button class="absolute right-3 top-3.5 text-on-surface-variant/60 hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-lg opacity-80" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password Field -->
<div class="space-y-1.5">
<label class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant ml-1" for="confirm-password">Confirm Password</label>
<div class="relative">
<input class="w-full bg-surface-container-low border border-outline-variant/30 rounded-lg px-4 py-2.5 text-on-surface text-sm focus:ring-0 focus:border-primary-container outline-none transition-all placeholder:text-outline" id="confirm-password" placeholder="••••••••" type="password" required />
<button class="absolute right-3 top-3.5 text-on-surface-variant/60 hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-lg opacity-80" data-icon="visibility">visibility</span>
</button>
</div>
</div>
</div>
<div class="grid grid-cols-2 gap-4 pt-2">
<!-- Primary CTA -->
<button class="w-full artisan-gradient text-white font-semibold py-3 rounded-lg shadow-md hover:shadow-lg hover:opacity-95 active:scale-[0.98] transition-all uppercase tracking-widest text-sm" type="button" onclick="toggleAuth('login')">
                            Create Account
                        </button>
<!-- Social Login -->
<button class="w-full flex items-center justify-center gap-2 bg-white border border-outline-variant/40 hover:bg-surface-container-low text-on-surface font-semibold py-3 rounded-lg transition-all text-sm shadow-sm" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                            Google
                        </button>
</div>
<!-- Guest Access -->
<div class="text-center mt-auto pb-4">
<a class="text-xs font-semibold text-on-surface-variant hover:text-primary transition-colors" href="home.html">Browse as Guest</a>
</div>
</form>
</section>
<!-- Decorative Footer Line -->
<div class="h-1 w-full flex opacity-30">
<div class="flex-1 bg-primary"></div>
<div class="flex-1 bg-primary-container"></div>
<div class="flex-1 bg-secondary"></div>
<div class="flex-1 bg-tertiary-container"></div>
</div>
</div>
</main>
</div>

<script>
function toggleAuth(type) {
    const loginSection = document.getElementById('login-section');
    const registerSection = document.getElementById('register-section');
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    
    const activeClass = "px-8 py-3 text-sm font-semibold text-primary border-b-2 border-primary transition-all duration-200";
    const inactiveClass = "px-8 py-3 text-sm font-semibold text-on-surface-variant hover:text-primary transition-all duration-200";
    
    if (type === 'login') {
        loginSection.classList.remove('hidden');
        registerSection.classList.add('hidden');
        tabLogin.className = activeClass;
        tabRegister.className = inactiveClass;
    } else {
        loginSection.classList.add('hidden');
        registerSection.classList.remove('hidden');
        tabLogin.className = inactiveClass;
        tabRegister.className = activeClass;
    }
}
</script>
</body>
</html>
