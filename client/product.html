<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Product — BakeEase</title>
    <script src="../assets/js/tailwind-cdn.js"></script>
    <script src="./js/tailwind-config.js"></script>
    <link href="./styles/base.css" rel="stylesheet"/>
    <link href="./styles/product.css" rel="stylesheet"/>
</head>
<body class="bg-surface text-on-surface">
    <div id="navbar-placeholder"></div>
    <main class="max-w-7xl mx-auto px-8 pt-28 pb-20">
        <div id="product-detail">
            <!-- Skeleton loader -->
            <div class="flex flex-col lg:flex-row gap-16 animate-pulse">
                <div class="w-full lg:w-1/2"><div class="aspect-square rounded-xl bg-surface-container-highest"></div></div>
                <div class="w-full lg:w-1/2 space-y-6">
                    <div class="h-4 w-24 bg-surface-container-highest rounded"></div>
                    <div class="h-10 w-3/4 bg-surface-container-highest rounded"></div>
                    <div class="h-4 w-1/2 bg-surface-container-highest rounded"></div>
                    <div class="h-8 w-32 bg-surface-container-highest rounded"></div>
                    <div class="h-24 w-full bg-surface-container-highest rounded"></div>
                </div>
            </div>
        </div>
        <div id="product-reviews" class="mt-24"></div>
        <div id="related-products" class="mt-32"></div>
    </main>
    <div id="footer-placeholder"></div>
    <script src="./js/api.js"></script>
    <script src="./js/cart.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/components.js"></script>
    <script src="./js/product.js"></script>
</body>
</html>
